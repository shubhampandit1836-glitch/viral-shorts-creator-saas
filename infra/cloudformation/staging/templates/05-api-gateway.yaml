    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceVideos
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VideosListLambdaArn}/invocations"

