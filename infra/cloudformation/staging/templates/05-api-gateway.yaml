AWSTemplateFormatVersion: "2010-09-09"
Description: AI Clip Finder - API Gateway (frontend routes + direct pipeline routes)

Parameters:
  ProjectPrefix:
    Type: String
    Default: acf-staging
  Environment:
    Type: String
    Default: staging
  # API Lambdas
  UploadUrlLambdaArn:
    Type: String
  VideosListLambdaArn:
    Type: String
  VideoGetLambdaArn:
    Type: String
  VideoClipsLambdaArn:
    Type: String
  VideoTranscriptLambdaArn:
    Type: String
  VideoRegenerateLambdaArn:
    Type: String
  VideoDeleteLambdaArn:
    Type: String
  ClipDownloadLambdaArn:
    Type: String
  # Pipeline Lambdas (direct invoke via API — matches Pinpole diagram)
  AudioExtractorLambdaArn:
    Type: String
  AIAnalyzerLambdaArn:
    Type: String
  WhisperTranscriberLambdaArn:
    Type: String
  TranscriptChunkerLambdaArn:
    Type: String
  ClipGeneratorLambdaArn:
    Type: String
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Access-Control-Allow-Origin value

Resources:
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectPrefix}-api"
      Description: AI Clip Finder API - Regional
      EndpointConfiguration:
        Types: [REGIONAL]

  # ─── CORS Gateway Responses (errors include CORS headers) ─
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # ─── Frontend API Routes ───────────────────────────────────

  ApiResourceUploadUrl:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: upload-url

  ApiMethodUploadUrl:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResourceUploadUrl
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadUrlLambdaArn}/invocations"

  ApiResourceVideos:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: videos

  ApiMethodVideosList:
